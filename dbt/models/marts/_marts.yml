version: 2

models:
  - name: dim_stops
    description: One row per bus stop, with service count and whether we poll it.
    columns:
      - name: bus_stop_code
        data_tests: [unique, not_null]

  - name: dim_routes
    description: Every service's route, stop by stop, with names and scheduled frequencies.
    columns:
      - name: service_no
        data_tests: [not_null]

  - name: commute_legs
    description: >
      My commute both ways, one row per trip, route, leg and service.
      to_nus = The Hillford (42189) to Ctrl Lib (16181); to_home = Information Technology (16189) to Signature Pk Condo (42171).
    columns:
      - name: trip
        data_tests:
          - accepted_values:
              arguments:
                values: ['to_nus', 'to_home']
      - name: route
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B']
